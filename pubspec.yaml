name: bs_flutter_project_task
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  intl: ^0.20.2 # Internationalization support
  flutter_bloc: ^9.0.0  # BLoC state management
  equatable: ^2.0.7  # Object comparison (used with BLoC)
  get_it: ^8.0.3  # Dependency injection
  injectable: ^2.5.0  # Code generation for DI
  http: ^1.3.0  # HTTP requests
  get_storage: ^2.1.1  # Local storage
  internet_connection_checker: ^1.0.0+1  # Check internet connection
  connectivity_plus: ^6.0.3  # Network status detection
  cached_network_image: ^3.4.1  # Cache network images
  flutter_svg: ^2.0.17 # svg images
  intl_phone_field: ^3.1.0 # country code picker
  fl_chart: ^0.70.2 # chart
  firebase_core: ^3.13.0 # firebase core
  firebase_auth: ^5.5.2 # firebase auth
 


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/  # Image assets

  fonts:
    - family: Inter  # Custom fonts
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: Poppins  # Custom fonts
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

 
